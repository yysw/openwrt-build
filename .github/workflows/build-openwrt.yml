name: Build OpenWrt

on:
  repository_dispatch:
  release:
    types: published
  push:
    branches:
      - master
    paths:
    - '.'
#  schedule:
#    - cron: 0 8 * * 5
  watch:
    types: started

env:
  REPO_URL: https://github.com/yysw/lede.git
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  SSH_ACTIONS: false
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: false
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write
  
jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
        
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update && sudo apt-get install -y qemu-utils bc lm-sensors pciutils libpam0g-dev libtiff-dev
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Check space
      if: (!cancelled())
      run: df -hT

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
  
    - name: Compute feeds hash
      id: feeds-hash
      run: |
        if [ -f feeds.conf.default ]; then
          hash="$(sha1sum feeds.conf.default | cut -d' ' -f1)"
        elif [ -f openwrt/feeds.conf.default ]; then
          hash="$(sha1sum openwrt/feeds.conf.default | cut -d' ' -f1)"
        else
          hash="none"
        fi
        echo "hash=${hash}" >> "$GITHUB_OUTPUT"

    - name: Restore cache for dl
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-openwrt-dl-${{ steps.feeds-hash.outputs.hash }}
        restore-keys: |
          ${{ runner.os }}-openwrt-dl-
          ${{ runner.os }}-openwrt-

    - name: Ensure ccache directory exists
      run: mkdir -p openwrt/.ccache

    - name: Restore cache for ccache
      uses: actions/cache@v4
      with:
        path: openwrt/.ccache
        key: ${{ runner.os }}-openwrt-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-openwrt-ccache-
      
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j"$(nproc)" || {
          make -j1 V=sc 2>&1 | tee "$GITHUB_WORKSPACE/compile-error.log"
          exit "${PIPESTATUS[0]}"
        }
    
    - name: Upload compile log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: compile-error-log
        path: compile-error.log

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload artifact
      if: success()
      uses: actions/upload-artifact@master
      with:
        name: OpenWrt
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: success()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Verify firmware
      if: success()
      run: |
        echo "Firmware directory:"
        ls -lh ${{ env.FIRMWARE }}

        if ! find "${{ env.FIRMWARE }}" \
          \( -name "*.img*" -o -name "*sysupgrade*" -o -name "*.bin" \) \
          | grep -q .; then
          echo "No firmware image found!"
          exit 1
        fi

    - name: Generate release tag
      id: tag
      if: success()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      if: success() && steps.tag.outputs.release_tag != ''
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body: "Auto built OpenWrt firmware"
        files: ${{ env.FIRMWARE }}/*
